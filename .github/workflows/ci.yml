name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: wasm build check
        run: cargo build -p sim-wasm --target wasm32-unknown-unknown --release

  windows:
    name: Windows (build, test, wasm target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace
      - name: wasm build check
        run: cargo build -p sim-wasm --target wasm32-unknown-unknown --release

  windows-tauri:
    name: Windows Tauri packaging spike (build)
    runs-on: windows-latest
    # Consumes the frontend job's already-built web/dist (see its "upload
    # dist for windows-tauri" step) instead of rebuilding the frontend here.
    # web/src has a few PascalCase-component/camelCase-logic filename pairs
    # (e.g. DynastyPanel.tsx/dynastyPanel.ts) that only collide under a
    # case-insensitive filesystem, which breaks `tsc -b` on windows-latest;
    # see issue #158, unrelated to and not fixed by this spike. Building
    # the frontend only once, on Linux, keeps this job's scope to exactly
    # what issue #103 is validating: does the Tauri shell/config/icons
    # compile and bundle on a real Windows toolchain.
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            web/src-tauri -> target
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: tauri build (nsis, Windows target only)
        # Overrides tauri.conf.json's beforeBuildCommand (npm run build:wasm
        # && npm run build) to a no-op: web/dist already exists, downloaded
        # above, so there is nothing to build before the native shell. This
        # job's build/bundle of that shell is issue #103's actual validation
        # evidence: a green run here proves the Tauri config, icons, and
        # Rust shell compile and bundle (NSIS) on a real Windows toolchain.
        # It does not prove the resulting window/installer behaves correctly
        # at runtime on Windows; that still needs a human on real hardware,
        # tracked in issue #152.
        working-directory: web
        # bash (Git for Windows), not the runner's default pwsh, so the
        # double-quote escaping in --config below is unambiguous.
        shell: bash
        run: npx tauri build --config "{\"build\":{\"beforeBuildCommand\":null}}"

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: build wasm bridge
        working-directory: web
        run: npm run build:wasm
      - name: lint
        working-directory: web
        run: npm run lint
      - name: format check
        working-directory: web
        run: npm run format:check
      - name: typecheck
        working-directory: web
        run: npx tsc -b
      - name: test (includes the copy lint)
        working-directory: web
        run: npm test
      - name: build
        working-directory: web
        run: npm run build
      - name: upload dist for windows-tauri
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
