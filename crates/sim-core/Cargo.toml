[package]
name = "sim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic, headless simulation core for Sector Dynasties. No I/O, no rendering."

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: without it, serde_json's default float parser can be off
# by one ULP on reparse (verified against 1.0.151), which silently breaks
# exact save/load round trips. See docs/adr/0001-simulation-core-stack.md.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# `test = false` keeps `cargo test --workspace` from also executing the full
# criterion run (harness = false means the binary's main() *is* the
# benchmark loop, so without this cargo test would run it as a slow "test").
# Benchmarks are invoked explicitly via `cargo bench -p sim-core`.
[[bench]]
name = "step_days"
harness = false
test = false
